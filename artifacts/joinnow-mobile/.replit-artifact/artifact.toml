kind = "mobile"
previewPath = "/joinnow-mobile/"
title = "JoinNow Android"
description = "Android companion for discovering local meets, joining events, and chatting with participants."
version = "1.0.0"
id = "artifacts/joinnow-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/joinnow-mobile/" ]
localPort = 18168

[services.development]
run = "pnpm --filter @workspace/joinnow-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/joinnow-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/joinnow-mobile", "run", "serve" ]

[services.env]
PORT = "18168"
BASE_PATH = "/joinnow-mobile/"
